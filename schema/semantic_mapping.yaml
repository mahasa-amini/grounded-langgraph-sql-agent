business_terms:
  flow:
    kind: metric
    description: Water flow measurement.
    table: sensor_measurements
    metric_column: value
    time_column: timestamp
    synonyms:
      - flow
      - water flow
      - flow rate
      - sensor value
      - measurement value
    filters: []

  incoming_flow:
    kind: metric
    description: Incoming water flow measurement.
    table: sensor_measurements
    metric_column: value
    time_column: timestamp
    synonyms:
      - incoming flow
      - inflow
      - input flow
      - incomingflow
    filters:
      - column: type
        operator: "="
        value: flow_in

  sensor:
    kind: dimension
    description: Sensor identifier.
    table: sensor_measurements
    column: sensor_id
    synonyms:
      - sensor
      - sensor id
      - device
      - device id

  city:
    kind: dimension
    description: City filter.
    table: sensor_measurements
    column: city
    synonyms:
      - city
      - town
      - municipality

  district:
    kind: dimension
    description: District or area filter.
    table: sensor_measurements
    column: district
    synonyms:
      - district
      - area
      - zone
      - neighborhood

  measurement_type:
    kind: dimension
    description: Measurement type filter.
    table: sensor_measurements
    column: type
    synonyms:
      - type
      - measurement type
      - flow type

